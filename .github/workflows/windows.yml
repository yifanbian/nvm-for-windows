name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: nvm-windows-x64
          path: target/release/nvm-for-windows-rs.exe
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: nvm-windows-x64
          path: ${{ runner.temp }}\nvm-artifact

      - name: Add downloaded binary to PATH
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP 'nvm-bin'
          New-Item -ItemType Directory -Force $binDir | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'nvm-artifact\nvm-for-windows-rs.exe') $binDir
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Exercise downloaded binary and Node.js shims
        shell: pwsh
        run: ./tests/ci-smoke.ps1

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: nvm-windows-x64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/nvm-for-windows-rs.exe
          fail_on_unmatched_files: true